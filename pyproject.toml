[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "m365-posture"
version = "0.1.0"
description = "Read-only Microsoft 365 / Entra ID posture reporting via Microsoft Graph"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
keywords = ["microsoft-graph", "entra-id", "azure-ad", "m365", "security", "posture", "automation", "intune"]
authors = [{name = "DNBLabs"}]
dependencies = [
    "azure-identity",
    "msgraph-sdk",
    "jinja2",
]

[project.scripts]
m365-posture = "m365_posture.cli:main"

[project.optional-dependencies]
dev = ["pytest"]

[project.urls]
Homepage = "https://github.com/DNBLabs/m365-posture"
Repository = "https://github.com/DNBLabs/m365-posture"
Issues = "https://github.com/DNBLabs/m365-posture/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
